name: MecaTrack - pruebas de integracion

on:
  push:
    paths:
      - 'PROYECTO_FINAL/backend/**'
      - '.github/workflows/mecatrack-tests.yml'
  pull_request:
    paths:
      - 'PROYECTO_FINAL/backend/**'
      - '.github/workflows/mecatrack-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taller_mecanico_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: PROYECTO_FINAL/backend

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/taller_mecanico_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: PROYECTO_FINAL/backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest
